<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">

    <title>Week 3 Tailwind Assignment</title>
</head>

<body class="bg-gray-100">

    <!-- Main Container -->
    <div class="min-h-screen py-10 px-6">

        <!-- ==================== -->
        <!-- PART 2: PROFILE CARD -->
        <!-- ==================== -->

        <div class="max-w-sm w-full bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow duration-300 p-6 text-center">

            <!-- Profile Photo -->
            <img
                src="images/profile.jpg"
                alt="Saro Nelly"
                class="w-24 h-24 mx-auto rounded-full object-cover"
            >

            <!-- Name -->
            <h1 class="text-2xl font-bold text-gray-800 mt-4">
                Saro Nelly
            </h1>

            <!-- Bio -->
            <p class="text-gray-600 mt-2">
                I am a beginner front-end developer who enjoys
                creating beautiful and useful websites.
            </p>

            <!-- Skills -->
            <div class="mt-4">

                <span class="inline-block text-xs px-2 py-1 rounded-full bg-pink-100 text-pink-700 mr-2">
                    HTML
                </span>

                <span class="inline-block text-xs px-2 py-1 rounded-full bg-purple-100 text-purple-700">
                    Tailwind CSS
                </span>

            </div>

        </div>


        <!-- ================= -->
        <!-- PART 3: NOTICE -->
        <!-- ================= -->

        <div class="max-w-sm w-full bg-amber-100 text-amber-800 py-4 px-6 border-l-4 border-amber-500 rounded-lg font-medium mt-8">

            This is an important notice.

        </div>


        <!-- ======================== -->
        <!-- PART 4: PRICING BOX -->
        <!-- ======================== -->

        <div class="max-w-xs w-full bg-white rounded-xl border border-gray-200 shadow-md p-6 mt-8">

            <!-- Plan Name -->
            <h2 class="text-xl font-bold text-gray-800">
                Starter Plan
            </h2>

            <!-- Price -->
            <p class="text-4xl font-bold text-pink-600 mt-4">
                $9

                <span class="text-sm text-gray-500 font-normal">
                    /month
                </span>
            </p>

            <!-- Features -->
            <ul class="space-y-2 mt-6 text-gray-600">

                <li>
                    ✓ Basic website hosting
                </li>

                <li>
                    ✓ 5 projects
                </li>

                <li>
                    ✓ Email support
                </li>

                <li>
                    ✓ Basic analytics
                </li>

            </ul>

            <!-- Button -->
            <button
                class="w-full mt-6 bg-pink-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-pink-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-pink-500 focus-visible:ring-offset-2 transition"
            >
                Choose Plan
            </button>

        </div>

    </div>

</body>
</html>
